schema_version = 1 # version of TOML structure

[experiment]
name = "tinystories-smoke"
seed = 1337
tags = ["smoke", "local"]

[data]
name = "tinystories"
version = "gpt4-tokenized-v1"
train_file = "tinystories/TinyStoriesV2-GPT4-train_tokd.npy"
validation_file = "tinystories/TinyStoriesV2-GPT4-valid_tokd.npy"

[tokenizer]
vocab_file = "tokenizers/ts_train_10000_vocab.pkl"
merges_file = "tokenizers/ts_train_10000_merges.pkl"
end_of_text = "<|endoftext|>"

[model]
vocab_size = 10000
context_length = 32
num_heads = 4
num_layers = 2
d_model = 64
d_ff = 192
rope_theta = 10000.0

[training]
batch_size = 2
steps = 4
grad_clip = 1.0
lr_mode = "basic"
learning_rate = 0.001
weight_decay = 0.0
betas = [0.9, 0.999]
epsilon = 1e-8

[evaluation]
every_steps = 2
batches = 2

[logging]
every_steps = 1

[checkpoint]
every_steps = 2
keep_last = 2

[runtime]
device = "cpu"

[tracking]
wandb_mode = "disabled"
wandb_project = "cs336-assignment1"
